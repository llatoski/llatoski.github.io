<style>
@font-face{font-family:Newsreader;src:url(fonts/newsreader-sub.woff2)format("woff2");font-weight:300 600;font-style:normal;font-display:swap}
@font-face{font-family:"Plex Sans";src:url(fonts/plexsans-sub.woff2)format("woff2");font-weight:400 600;font-style:normal;font-display:swap}
@font-face{font-family:"Plex Mono";src:url(fonts/plexmono-sub.woff2)format("woff2");font-weight:400;font-style:normal;font-display:swap}

:root{
  --bone:#f4f5f7; --panel:#eaecf0; --ink:#14181b; --slate:#586270;
  --rule:#d5d9e0; --blue:#0033cc; --red:#cc0000; --red-soft:#fcbba1;
  --serif:Newsreader,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --gutter:clamp(1rem,5vw,4.5rem);
}
@media (prefers-color-scheme:dark){
  :root{--bone:#0e1116;--panel:#151a21;--ink:#e8eaee;--slate:#9aa3ae;
        --rule:#28303a;--blue:#9ecae1;--red:#fcbba1;--red-soft:#fcbba1}
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--bone); color:var(--ink);
  font-family:var(--sans); font-size:1.0625rem; line-height:1.6;
  text-rendering:optimizeLegibility; -webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--red); outline-offset:4px; border-radius:1px}
::selection{background:var(--red-soft); color:#14181b}

.stage{position:relative; min-height:100svh; min-height:100vh; display:flex; align-items:center;
  overflow:hidden; isolation:isolate; padding:clamp(2.5rem,8vh,5rem) var(--gutter)}
.field{position:absolute; inset:0; z-index:-2;
  background-color:var(--panel);
  background-image:repeating-linear-gradient(to right,var(--rule) 0 1px,transparent 1px 14px),
                   repeating-linear-gradient(to bottom,var(--rule) 0 1px,transparent 1px 14px)}
.field canvas{display:block; width:100%; height:100%; opacity:0; transition:opacity .6s ease}
.field canvas.on{opacity:1}
.veil{position:absolute; inset:0; z-index:-1; pointer-events:none;
  background:radial-gradient(ellipse 62% 58% at 50% 52%,rgba(244,245,247,.95) 0%,rgba(244,245,247,.82) 50%,rgba(244,245,247,.18) 100%)}
@media (prefers-color-scheme:dark){
  .veil{background:radial-gradient(ellipse 62% 58% at 50% 52%,rgba(14,17,22,.95) 0%,rgba(14,17,22,.82) 50%,rgba(14,17,22,.22) 100%)}
}

.inner{max-width:52rem; width:100%; margin:0 auto; text-align:center}
.eyebrow{font-family:var(--mono); font-size:.72rem; letter-spacing:.2em; text-transform:uppercase;
  color:var(--slate); margin:0 0 1.4rem}
h1{font-family:var(--serif); font-weight:300; font-size:clamp(2.4rem,7vw,4.75rem);
  line-height:1; letter-spacing:-.022em; margin:0}
h1 .given{display:block; color:var(--slate); font-size:.46em; letter-spacing:.01em;
  font-weight:400; line-height:1.2; margin-bottom:.3em}
.prompt{margin:clamp(1.6rem,4vh,2.4rem) 0 clamp(1.6rem,4vh,2.6rem); color:var(--slate); font-size:1rem}

.choices{display:grid; grid-template-columns:1fr 1fr; gap:clamp(.9rem,2.5vw,1.5rem)}
.choice{position:relative; display:block; text-align:left; color:var(--ink); text-decoration:none;
  background:color-mix(in srgb,var(--bone) 88%,transparent);
  border:1px solid var(--rule); border-radius:2px;
  padding:clamp(1.4rem,3.5vw,2.1rem) clamp(1.2rem,3vw,1.8rem) clamp(1.3rem,3vw,1.8rem);
  transition:border-color .18s ease, transform .18s ease, box-shadow .18s ease}
.choice::before{content:""; position:absolute; left:clamp(1.2rem,3vw,1.8rem); top:-1px;
  width:2.2rem; height:2px; background:var(--red); transition:width .25s ease}
.choice:hover,.choice:focus-visible{border-color:var(--blue); transform:translateY(-2px);
  box-shadow:0 10px 28px -18px rgba(20,24,27,.45)}
.choice:hover::before,.choice:focus-visible::before{width:calc(100% - 2*clamp(1.2rem,3vw,1.8rem))}
.choice .tag{display:block; font-family:var(--mono); font-size:.68rem; letter-spacing:.18em;
  text-transform:uppercase; color:var(--slate); margin-bottom:.8rem}
.choice .name{display:flex; justify-content:space-between; align-items:baseline; gap:1rem;
  font-family:var(--serif); font-weight:400; font-size:clamp(1.55rem,3.4vw,2.1rem);
  line-height:1.15; letter-spacing:-.012em}
.choice .arrow{color:var(--red); font-family:var(--sans); font-size:.8em; transition:transform .18s ease}
.choice:hover .arrow,.choice:focus-visible .arrow{transform:translateX(4px)}
.choice .desc{display:block; margin-top:.6rem; font-size:.9375rem; color:var(--slate)}
@media (max-width:620px){
  .choices{grid-template-columns:1fr}
  .eyebrow{font-size:.62rem; letter-spacing:.13em}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important; transition-duration:.001ms!important}
}
</style>
</head>
<body>
<main class="stage">
  <div class="field" id="field" aria-hidden="true"><canvas id="pvm"></canvas></div>
  <div class="veil" aria-hidden="true"></div>
  <div class="inner">
    <p class="eyebrow">Porto Alegre · Brazil</p>
    <h1><span class="given">Luís Carlos Fagundes</span>Latoski</h1>
    <p class="prompt">Which side of my work are you here for?</p>
    <nav class="choices" aria-label="Choose a site">
      <a class="choice" href="ai-training/">
        <span class="tag">Industry</span>
        <span class="name">AI Training <span class="arrow" aria-hidden="true">→</span></span>
        <span class="desc">Expert data, evaluation and review for frontier models.</span>
      </a>
      <a class="choice" href="academic/">
        <span class="tag">Research</span>
        <span class="name">Academic <span class="arrow" aria-hidden="true">→</span></span>
        <span class="desc">Statistical physics, publications and CV.</span>
      </a>
    </nav>
  </div>
</main>
<script>
(function(){
  "use strict";
  var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---- persistent voter model, on a lattice, behind the name ----
     Each site holds an opinion s and a confidence e. Agreement with a
     neighbour raises e; disagreement flips the opinion with probability
     1-e and resets it. Sites at e=1 are frozen zealots (pale); the still-active
     sites are the saturated thread along the domain walls.                 */
  var host=document.getElementById("field"), cv=document.getElementById("pvm");
  if(!cv||!cv.getContext) return;
  var lowPower=(navigator.deviceMemory&&navigator.deviceMemory<=2)||
               (navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=2)||
               (navigator.connection&&navigator.connection.saveData);

  var DE=0.010, ctx=cv.getContext("2d",{alpha:false});
  var buf=document.createElement("canvas"), bctx=buf.getContext("2d",{alpha:false});
  var W=0,H=0,N=0,img=null,px=null,s=null,e=null;
  var dark=matchMedia("(prefers-color-scheme: dark)").matches;
  /* thesis snapshot palette: pale = zealot, saturated = active (dark mode dims the zealots) */
  var C=dark?{zm:[20,38,58],m:[0,51,204],p:[204,0,0],zp:[58,24,22]}
            :{zm:[158,202,225],m:[0,51,204],p:[204,0,0],zp:[252,187,161]};

  /* xorshift32: the inner loop draws three numbers per update, and this is
     several times cheaper than Math.random there */
  var rs=(Date.now()^0x9e3779b9)|0; if(rs===0) rs=1;
  function rint(m){ rs^=rs<<13; rs^=rs>>>17; rs^=rs<<5; return (rs>>>0)%m; }
  function rflt(){ rs^=rs<<13; rs^=rs>>>17; rs^=rs<<5; return (rs>>>0)*2.3283064365386963e-10; }

  function seed(w,h){
    W=w; H=h; N=W*H;
    buf.width=W; buf.height=H;
    img=bctx.createImageData(W,H); px=img.data;
    s=new Int8Array(N); e=new Float32Array(N);
    var i, half=N>>1;
    for(i=0;i<N;i++) s[i]=i<half?0:1;
    for(i=N-1;i>0;i--){ var q=rint(i+1), tmp=s[i]; s[i]=s[q]; s[q]=tmp; }
  }
  function step(sweeps){
    var n=(N*sweeps)|0;
    for(var k=0;k<n;k++){
      var i=rint(N), x=i%W, y=(i/W)|0, j, r=rint(4);
      if(r===0) j=y*W+((x+1)%W);
      else if(r===1) j=y*W+((x+W-1)%W);
      else if(r===2) j=((y+1)%H)*W+x;
      else j=((y+H-1)%H)*W+x;
      if(s[i]===s[j]){ if(e[i]<1){ var v=e[i]+DE; e[i]=v>1?1:v; } }
      else if(rflt()<1-e[i]){ s[i]=s[j]; e[i]=0; }
      else { var w=e[i]-DE; e[i]=w<0?0:w; }
    }
  }
  function paint(){
    var p=0;
    for(var i=0;i<N;i++){
      var z=s[i]?C.zp:C.zm, n=s[i]?C.p:C.m, act=1-e[i]; act=act*act;
      px[p++]=z[0]+(n[0]-z[0])*act;
      px[p++]=z[1]+(n[1]-z[1])*act;
      px[p++]=z[2]+(n[2]-z[2])*act;
      px[p++]=255;
    }
    bctx.putImageData(img,0,0);
    ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
    ctx.drawImage(buf,0,0,cv.width,cv.height);
  }
  /* At this reinforcement the domains need time to form, so the field is settled
     over a handful of frames rather than in one blocking pass, and only shown
     once it has coarsened. */
  var SETTLE=240;
  function warm(left){
    function tick(){
      var t0=performance.now(), g=0.05;
      do{ var s=left<g?left:g; step(s); left-=s; if(g<1) g*=2; }
      while(left>0 && performance.now()-t0<6);   /* time-boxed: never a long task */
      if(left>0) requestAnimationFrame(tick);
      else { paint(); cv.className="on"; begin(); }
    }
    requestAnimationFrame(tick);
  }
  /* keep the cells square: ~12k sites shaped to the hero box */
  function fit(now){
    var r=host.getBoundingClientRect();
    var aw=Math.max(1,r.width), ah=Math.max(1,r.height), k=Math.sqrt(12000/(aw*ah));
    var w=Math.max(48,Math.min(320,Math.round(aw*k))), h=Math.max(48,Math.min(320,Math.round(ah*k)));
    cv.width=Math.max(1,Math.round(Math.min(aw,1500)/3));
    cv.height=Math.max(1,Math.round(Math.min(ah,1500)/3));
    if(w===W&&h===H){ paint(); return; }
    seed(w,h);
    if(now){ step(SETTLE); paint(); cv.className="on"; begin(); } else warm(SETTLE);
  }
  addEventListener("resize",function(){clearTimeout(fit._t);fit._t=setTimeout(function(){fit(1)},200)},{passive:true});

  var vis=true, last=0, MIN=1000/30, started=false;
  function loop(t){
    requestAnimationFrame(loop);
    if(!vis||document.hidden||t-last<MIN) return;
    last=t; step(0.45); paint();
  }
  /* the field only starts moving once it has settled, and a beat after that */
  function begin(){
    if(started||reduce||lowPower) return;   /* reduced motion keeps the settled frame */
    started=true;
    if("IntersectionObserver" in window){
      new IntersectionObserver(function(es){vis=es[0].isIntersecting;},{threshold:0}).observe(host);
    }
    setTimeout(function(){requestAnimationFrame(loop);},500);
  }

  requestAnimationFrame(function(){fit();});
})();
</script>
</body>
</html>
